<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite Auction - Đăng Nhập / Đăng Ký</title>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="Auth.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <!-- Logo Header chuẩn Elite Auction -->
        <div class="logo-area">
          <i class="fa-solid fa-gavel logo-icon"></i>
          <div>
            <h1 class="brand-title">Elite Auction</h1>
            <p class="brand-subtitle">
              Tinh hoa sưu tầm · Giá trị vượt thời gian
            </p>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="auth-tabs">
          <button class="tab-btn active" id="tabLogin" data-tab="login">
            <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
          </button>
          <button class="tab-btn" id="tabRegister" data-tab="register">
            <i class="fa-solid fa-user-plus"></i> Đăng ký
          </button>
        </div>

        <!-- Form Đăng Nhập -->
        <form id="loginForm" class="auth-form active">
          <div class="form-group">
            <label for="loginUsername">Tên đăng nhập</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user input-icon"></i>
              <input
                type="text"
                id="loginUsername"
                placeholder="Nhập tên đăng nhập"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="loginPassword">Mật khẩu</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input
                type="password"
                id="loginPassword"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn-toggle-pw"
                title="Hiện/Ẩn mật khẩu"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập ngay
          </button>
        </form>

        <!-- Form Đăng Ký -->
        <form id="registerForm" class="auth-form">
          <div class="form-group">
            <label for="regUsername">Tên đăng nhập</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user input-icon"></i>
              <input
                type="text"
                id="regUsername"
                placeholder="Tạo tên đăng nhập"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="regPassword">Mật khẩu</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input
                type="password"
                id="regPassword"
                placeholder="Tạo mật khẩu"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="btn-toggle-pw"
                title="Hiện/Ẩn mật khẩu"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword">Xác nhận mật khẩu</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-shield-halved input-icon"></i>
              <input
                type="password"
                id="regConfirmPassword"
                placeholder="Nhập lại mật khẩu"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="btn-toggle-pw"
                title="Hiện/Ẩn mật khẩu"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-user-plus"></i> Tạo tài khoản
          </button>
        </form>

        <div class="auth-footer">
          <p>© 2026 Elite Auction. Tất cả quyền được bảo lưu.</p>
        </div>
      </div>
    </div>

    <!-- Modal Thông Báo / Kết Quả Đồng Bộ Modal Đấu Giá -->
    <div class="modal-overlay" id="authModal">
      <div class="modal-card">
        <div class="modal-icon success-icon" id="modalIcon">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h3 class="modal-title" id="modalTitle">Thành công!</h3>
        <p class="modal-message" id="modalMessage">
          Thao tác đã được thực hiện thành công.
        </p>
        <button class="btn-modal-action" id="btnCloseModal">Đóng</button>
      </div>
    </div>

    <script src="Auth.js"></script>
  </body>
</html>
