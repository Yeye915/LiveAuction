<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phòng Đấu Giá Trực Tuyến - Real-time & P2P</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        .main-container { display: flex; gap: 20px; }
        .column { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        video { width: 100%; max-height: 250px; background: #000; border-radius: 4px; object-fit: cover; }
        .chat-box { height: 150px; border: 1px solid #ccc; border-radius: 4px; overflow-y: scroll; padding: 10px; background: #fafafa; margin-bottom: 10px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input, button { padding: 8px; font-size: 14px; }
        input { flex: 1; }
        button { background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .bid-section { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
        .price-tag { font-size: 18px; font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>

<h2>Phòng Đấu Giá #101 (Demo Giữa Kỳ)</h2>

<div style="margin-bottom: 15px;">
    <button onclick="joinAsAuctioneer()">Vào vai: ĐẤU GIÁ VIÊN</button>
    <button onclick="joinAsViewer()">Vào vai: KHÁCH HÀNG (Xem & Chat)</button>
</div>

<div class="main-container">
    <!-- CỘT 1: LIVESTREAM & CHẶNG P2P -->
    <div class="column">
        <h3>🎥 Livestream P2P (WebRTC)</h3>
        <div>
            <label>Camera của bạn (Local):</label>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div style="margin-top: 10px;">
            <label>Livestream nhận được (Remote):</label>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <!-- CỘT 2: CHAT P2P & ĐẤU GIÁ REAL-TIME -->
    <div class="column">
        <h3>💬 Chat P2P (Trực tiếp trình duyệt)</h3>
        <div id="chatMessages" class="chat-box"></div>
        <div class="input-group">
            <input type="text" id="chatInput" placeholder="Nhập tin nhắn P2P...">
            <button onclick="sendChatMessage()">Gửi</button>
        </div>

        <div class="bid-section">
            <h3>💰 Khu vực Đấu Giá (Bidding)</h3>
            <p>Giá cao nhất hiện tại: <span id="currentBid" class="price-tag">0 VNĐ</span></p>
            <div class="input-group">
                <input type="number" id="bidInput" placeholder="Nhập số tiền đặt giá...">
                <button onclick="sendBid()">Ra giá</button>
            </div>
        </div>
    </div>
</div>

<!-- Nhập thư viện SockJS và STOMP Client -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>
    const auctionId = 101;
    let stompClient = null;
    let peerConnection = null;
    let localStream = null;
    let dataChannel = null; // Kênh dữ liệu P2P dùng để Chat trực tiếp

    const rtcConfig = {
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    function joinAsAuctioneer() {
        initWebSocket();
        startBroadcast();
        appendSystemMessage("Đã vào phòng với tư cách Đấu giá viên.");
    }

    function joinAsViewer() {
        initWebSocket();
        initViewerCamera();
        appendSystemMessage("Đã vào phòng với tư cách Khách hàng.");
    }

    // --- 1. KẾT NỐI WEBSOCKET & SIGNALING & BIDDING SERVER ---
    function initWebSocket() {
        if (stompClient && stompClient.connected) return;

        const socket = new SockJS('http://localhost:8080/ws-auction');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);

            // Lắng nghe tín hiệu WebRTC Signaling
            stompClient.subscribe('/topic/auction/' + auctionId + '/signal', function (message) {
                handleSignalingMessage(JSON.parse(message.body));
            });

            // Lắng nghe kết quả Đấu giá (Bidding Broadcast)
            stompClient.subscribe('/topic/auction/' + auctionId + '/bids', function (message) {
                const bid = JSON.parse(message.body);
                document.getElementById('currentBid').innerText = bid.currentHighestBid.toLocaleString() + ' VNĐ';
                appendSystemMessage(`[ĐẤU GIÁ]: ${bid.message}`);
            });

            // Nếu là Khách hàng, gửi tín hiệu join để xin kết nối P2P từ Đấu giá viên
            if (!localStream) {
                sendSignal({ type: 'join', senderId: 'Viewer_' + Math.floor(Math.random() * 1000) });
            }
        });
    }

    function sendSignal(data) {
        stompClient.publish({
            destination: '/app/auction/' + auctionId + '/signal',
            body: JSON.stringify(data)
        });
    }

    // --- 2. XỬ LÝ WEBRTC (LIVESTREAM & CHAT P2P DATACHANNEL) ---
    async function startBroadcast() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
        } catch (error) {
            console.error('Lỗi mở Camera:', error);
        }
    }

    async function initViewerCamera() {
        // Khách hàng chuẩn bị nhận stream
        localStream = new MediaStream();
    }

    async function createPeerConnectionForViewer(viewerId) {
        peerConnection = new RTCPeerConnection(rtcConfig);

        // Đưa luồng Video/Audio của Đấu giá viên vào PeerConnection
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        // Tạo DataChannel để Chat P2P trực tiếp
        dataChannel = peerConnection.createDataChannel("p2p-chat");
        setupDataChannel();

        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                sendSignal({ type: 'candidate', senderId: 'Auctioneer', targetId: viewerId, payload: event.candidate });
            }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        sendSignal({ type: 'offer', senderId: 'Auctioneer', targetId: viewerId, payload: offer });
    }

    async function handleSignalingMessage(signal) {
        // Nếu mình là Khách hàng nhận Offer từ Đấu giá viên
        if (signal.type === 'offer') {
            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.ontrack = event => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            // Lắng nghe DataChannel do Đấu giá viên tạo ra
            peerConnection.ondatachannel = event => {
                dataChannel = event.channel;
                setupDataChannel();
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    sendSignal({ type: 'candidate', senderId: 'Viewer', payload: event.candidate });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.payload));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            sendSignal({ type: 'answer', senderId: 'Viewer', payload: answer });
        }
        else if (signal.type === 'answer' && peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.payload));
        }
        else if (signal.type === 'join') {
            createPeerConnectionForViewer(signal.senderId);
        }

        if (signal.type === 'candidate' && peerConnection) {
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(signal.payload));
            } catch (e) { console.error(e); }
        }
    }

    // --- 3. CƠ CHẾ CHAT P2P QUA DATACHANNEL ---
    function setupDataChannel() {
        dataChannel.onopen = () => appendSystemMessage("✅ Kết nối Chat P2P (DataChannel) đã sẵn sàng!");
        dataChannel.onclose = () => appendSystemMessage("❌ Đóng kết nối Chat P2P.");
        dataChannel.onmessage = event => {
            appendChatMessage("Đối phương (P2P): " + event.data);
        };
    }

    function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        if (!message) return;

        if (dataChannel && dataChannel.readyState === 'open') {
            // Gửi tin nhắn thẳng qua đường truyền P2P (Không qua Server)
            dataChannel.send(message);
            appendChatMessage("Tôi (P2P): " + message);
            input.value = '';
        } else {
            alert("Kết nối P2P Chat chưa được thiết lập!");
        }
    }

    // --- 4. GỬI ĐẤU GIÁ (BIDDING) QUA WEBSOCKET ---
    function sendBid() {
        const amount = parseFloat(document.getElementById('bidInput').value);
        if (isNaN(amount)) return;

        stompClient.publish({
            destination: '/app/auction/' + auctionId + '/bid',
            body: JSON.stringify({
                auctionId: auctionId,
                userId: 1,
                userName: "Thành Viên Demo",
                amount: amount
            })
        });
        document.getElementById('bidInput').value = '';
    }

    function appendChatMessage(text) {
        const chatBox = document.getElementById('chatMessages');
        chatBox.innerHTML += `<div>${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendSystemMessage(text) {
        const chatBox = document.getElementById('chatMessages');
        chatBox.innerHTML += `<div style="color: #666; font-style: italic;">${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
