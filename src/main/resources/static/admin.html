<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Trị Đấu Giá - Dành Cho Đấu Giá Viên</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; }
        .container { display: flex; gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        h2, h3 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        .btn-room { background: #007bff; text-decoration: none; color: #white; padding: 6px 12px; border-radius: 4px; display: inline-block; color: white;}
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<h2>Trang Quản Trị Đấu Giá Viên (Admin Dashboard)</h2>
<p><a href="/index.html">← Quay lại trang chủ khách hàng</a></p>
<hr>

<div class="container">
    <!-- FORM TẠO SẢN PHẨM & PHÒNG ĐẤU GIÁ -->
    <div class="card">
        <h3>1. Tạo Phiên Đấu Giá Mới</h3>
        <div class="form-group">
            <label>Tên phiên đấu giá:</label>
            <input type="text" id="title" placeholder="VD: Đấu giá tranh sơn mài...">
        </div>
        <div class="form-group">
            <label>Tên sản phẩm:</label>
            <input type="text" id="productName" placeholder="VD: Tranh sơn mài nghệ thuật">
        </div>
        <div class="form-group">
            <label>Mô tả sản phẩm:</label>
            <textarea id="productDesc" placeholder="Mô tả chi tiết sản phẩm..."></textarea>
        </div>
        <div class="form-group">
            <label>Giá khởi điểm (VNĐ):</label>
            <input type="number" id="startingPrice" placeholder="5000000">
        </div>
        <button onclick="createAuctionRoom()">Tạo Phòng & Mở Đấu Giá</button>
    </div>

    <!-- DANH SÁCH PHÒNG HIỆN CÓ -->
    <div class="card" style="flex: 1.5;">
        <h3>2. Danh Sách Phòng Đấu Giá Hiện Tại</h3>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Tiêu đề</th>
                <th>Giá khởi điểm</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody id="auctionTableBody">
            <!-- Dữ liệu load từ API -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Load danh sách phòng đấu giá
    async function loadAuctions() {
        try {
            const res = await fetch('http://localhost:8080/api/auctions');
            if (res.ok) {
                const auctions = await res.json();
                const tbody = document.getElementById('auctionTableBody');
                tbody.innerHTML = '';
                auctions.forEach(auc => {
                    tbody.innerHTML += `
                            <tr>
                                <td>${auc.id}</td>
                                <td>${auc.title}</td>
                                <td>${auc.startingPrice.toLocaleString()} VNĐ</td>
                                <td><b>${auc.status}</b></td>
                                <td>
                                    <a href="/auction-room.html?id=${auc.id}" class="btn-room" target="_blank">Vào Phát Sóng</a>
                                </td>
                            </tr>
                        `;
                });
            }
        } catch (e) {
            console.error("Lỗi tải danh sách:", e);
        }
    }

    // Tạo sản phẩm và phòng đấu giá
    async function createAuctionRoom() {
        const title = document.getElementById('title').value.trim();
        const productName = document.getElementById('productName').value.trim();
        const productDesc = document.getElementById('productDesc').value.trim();
        const startingPrice = parseFloat(document.getElementById('startingPrice').value);

        if (!title || !productName || isNaN(startingPrice)) {
            alert("Vui lòng điền đầy đủ thông tin!");
            return;
        }

        try {
            // Bước 1: Tạo Product trước
            const prodRes = await fetch('http://localhost:8080/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: productName, description: productDesc, basePrice: startingPrice })
            });
            const product = await prodRes.json();

            // Bước 2: Tạo Auction gắn với Product vừa tạo
            const aucRes = await fetch('http://localhost:8080/api/auctions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, startingPrice: startingPrice, product: product })
            });

            if (aucRes.ok) {
                alert("Tạo phòng đấu giá thành công!");
                loadAuctions();
                // Reset form
                document.getElementById('title').value = '';
                document.getElementById('productName').value = '';
                document.getElementById('productDesc').value = '';
                document.getElementById('startingPrice').value = '';
            } else {
                alert("Lỗi khi tạo phòng đấu giá!");
            }
        } catch (error) {
            console.error("Lỗi:", error);
            alert("Không thể kết nối tới Server!");
        }
    }

    loadAuctions();
</script>
</body>
</html>
