<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Hệ Thống Đấu Giá Real-time</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Đăng Nhập Đấu Giá</h2>
    <div class="form-group">
        <label>Tên đăng nhập:</label>
        <input type="text" id="username" placeholder="Nhập username (VD: admin, usera)...">
    </div>
    <div class="form-group">
        <label>Mật khẩu:</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu (123456)...">
    </div>
    <button onclick="handleLogin()">Đăng Nhập</button>
    <div id="errorMsg" class="error"></div>
</div>

<script>
    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!username || !password) {
            errorMsg.innerText = "Vui lòng nhập đầy đủ thông tin!";
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const user = await response.json();
                // Lưu thông tin user vào localStorage để dùng sau
                localStorage.setItem('currentUser', JSON.stringify(user));
                alert(`Đăng nhập thành công! Xin chào ${user.fullName}`);
                // Chuyển hướng sang trang danh sách phòng đấu giá
                window.location.href = '/index.html';
            } else {
                errorMsg.innerText = "Sai tên đăng nhập hoặc mật khẩu!";
            }
        } catch (error) {
            console.error('Lỗi kết nối:', error);
            errorMsg.innerText = "Không thể kết nối đến Server!";
        }
    }
</script>
</body>
</html>
