<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Phiên Đấu Giá</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; }
        h2 { color: #333; }
        .auction-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .auction-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .auction-card h3 { margin-top: 0; color: #007bff; }
        .price { font-weight: bold; color: #d9534f; }
        .btn-join { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #28a745; color: #fff; text-decoration: none; border-radius: 4px; text-align: center; }
        .btn-join:hover { background: #218838; }
        .user-info { float: right; color: #555; }
    </style>
</head>
<body>

<div class="user-info" id="userInfo"></div>
<h2>Danh Sách Phòng Đấu Giá Trực Tuyến</h2>
<hr>

<div id="auctionList" class="auction-grid">
    <!-- Dữ liệu phòng đấu giá sẽ được load động từ API -->
</div>

<script>
    // Hiển thị thông tin người dùng đang đăng nhập
    const user = JSON.parse(localStorage.getItem('currentUser'));
    if (user) {
        document.getElementById('userInfo').innerHTML = `Xin chào, <b>${user.fullName}</b> | <a href="#" onclick="logout()">Đăng xuất</a>`;
    } else {
        // Nếu chưa đăng nhập, đá về trang login
        window.location.href = '/login.html';
    }

    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = '/login.html';
    }

    // Gọi REST API lấy danh sách phiên đấu giá
    async function loadAuctions() {
        try {
            const response = await fetch('http://localhost:8080/api/auctions');
            if (response.ok) {
                const auctions = await response.json();
                const container = document.getElementById('auctionList');
                container.innerHTML = '';

                auctions.forEach(auc => {
                    container.innerHTML += `
                            <div class="auction-card">
                                <h3>${auc.title}</h3>
                                <p>Giá khởi điểm: <span class="price">${auc.startingPrice.toLocaleString()} VNĐ</span></p>
                                <p>Trạng thái: <b>${auc.status}</b></p>
                                <a href="/auction-room.html?id=${auc.id}" class="btn-join">Vào Phòng Đấu Giá</a>
                            </div>
                        `;
                });
            }
        } catch (error) {
            console.error('Lỗi tải danh sách đấu giá:', error);
        }
    }

    loadAuctions();
</script>
</body>
</html>
